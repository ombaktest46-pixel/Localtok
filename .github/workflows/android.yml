name: Build TikTok Offline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build TikTok Offline APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan!"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Find Gradle project
        id: find_project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan!"
            find project -maxdepth 5 -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "=== Project ==="
          ls -la

          echo "=== Build APK ==="
          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "=== APK ==="
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Offline-APK
          path: |
            project/**/build/outputs/apk/debug/*.apk
            project/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
