name: Build TikTok Offline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build TikTok Offline APK
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java untuk Android
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Ekstrak ZIP
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "Mencari ZIP..."

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          echo ""
          echo "=== Struktur project ==="
          find project -maxdepth 4 -type f | sort

      # 4. Cari folder utama Android
      - name: Find Gradle project
        id: find_project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts / settings.gradle tidak ditemukan!"
            echo ""
            echo "Isi project:"
            find project -maxdepth 5 -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "================================"
          echo "Android project ditemukan:"
          echo "$PROJECT_DIR"
          echo "================================"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 6. Build APK
      - name: Build Debug APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "=== File project ==="
          ls -la

          echo ""
          echo "=== Mulai build APK ==="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      # 7. Cari APK
      - name: Find APK
        shell: bash
        run: |
          echo "=== APK hasil build ==="
          find project -type f -name "*.apk" -print

      # 8. Upload APK
      - name: Upload TikTok Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Offline-APK
          path: |
            project/**/build/outputs/apk/debug/*.apk
            project/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
